# Nginx: única puerta de entrada de EntradasYa.
# Sirve la web y enruta /api/<servicio>/ a cada servicio (quitando el prefijo).
# payments y notifications NO se exponen: solo se llaman desde dentro del servidor.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/entradasya;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /api/auth/    { proxy_pass http://127.0.0.1:3001/; }
    location /api/events/  { proxy_pass http://127.0.0.1:3002/; }
    location /api/tickets/ { proxy_pass http://127.0.0.1:3004/; }
    location /api/orders/  { proxy_pass http://127.0.0.1:3006/; }
    location /api/checkin/ { proxy_pass http://127.0.0.1:3007/; }

    # Interfaz de Mailpit para ver los correos de prueba
    location /mailpit/ {
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # React: cualquier otra ruta la resuelve la web
    location / {
        try_files $uri $uri/ /index.html;
    }
}
